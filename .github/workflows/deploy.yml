name: Deploy production and staging to GitHub Pages
on:
  push:
    branches: [main, stg]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out deployment tools
        uses: actions/checkout@v4
        with:
          path: tools
      - name: Check out production
        uses: actions/checkout@v4
        with:
          ref: main
          path: production
      - name: Check out staging
        uses: actions/checkout@v4
        with:
          ref: stg
          path: staging
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            production/package-lock.json
            staging/package-lock.json
      - name: Build production
        working-directory: production
        run: npm ci && npm run build
      - name: Build staging
        working-directory: staging
        run: npm ci && npm run build
      - name: Assemble both sites
        run: |
          node tools/scripts/prepare-staging.mjs staging/dist
          mkdir -p production/dist/stg
          cp -a staging/dist/. production/dist/stg/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: production/dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Link preview
        run: echo 'Staging preview — https://www.redflagdata.com/stg/' >> "$GITHUB_STEP_SUMMARY"
      - name: Notify deployments channel
        continue-on-error: true
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DEPLOY_ENVIRONMENT: ${{ github.ref_name == 'stg' && 'staging website' || 'production website' }}
          DEPLOY_URL: ${{ github.ref_name == 'stg' && 'https://www.redflagdata.com/stg/' || 'https://www.redflagdata.com/' }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          COMMIT_SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: python
        run: |
          import json
          import os
          import urllib.request

          webhook = os.environ.get("DISCORD_WEBHOOK_URL")
          if not webhook:
              print("::warning::Set DISCORD_WEBHOOK_URL to enable deployment notifications.")
              raise SystemExit(0)
          subject = os.environ["COMMIT_MESSAGE"].splitlines()
          subject = subject[0][:250] if subject else os.environ["COMMIT_SHA"][:7]
          content = (
              f"Deployed {os.environ['DEPLOY_ENVIRONMENT']} : {subject}\n"
              f"{os.environ['DEPLOY_URL']}\n"
              f"Deployment: {os.environ['RUN_URL']}"
          )
          payload = json.dumps({"content": content, "allowed_mentions": {"parse": []}}).encode()
          request = urllib.request.Request(
              webhook, data=payload,
              headers={"Content-Type": "application/json", "User-Agent": "Redflag-Deployments"},
              method="POST",
          )
          try:
              with urllib.request.urlopen(request, timeout=20) as response:
                  print(f"Deployment notification sent ({response.status}).")
          except Exception:
              print("::error::Discord deployment notification failed.")
              raise SystemExit(1)
