name: Deploy production and staging to GitHub Pages
on:
  push:
    branches: [main, stg]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out deployment tools
        uses: actions/checkout@v4
      - name: Check out production
        uses: actions/checkout@v4
        with:
          ref: main
          path: production
      - name: Check out staging
        uses: actions/checkout@v4
        with:
          ref: stg
          path: staging
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            production/package-lock.json
            staging/package-lock.json
      - name: Build production
        working-directory: production
        run: npm ci && npm run build
      - name: Build staging
        working-directory: staging
        run: npm ci && npm run build
      - name: Assemble both sites
        run: |
          node scripts/prepare-staging.mjs staging/dist
          mkdir -p production/dist/stg
          cp -a staging/dist/. production/dist/stg/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: production/dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Link preview
        run: echo 'Staging preview — https://www.redflagdata.com/stg/' >> "$GITHUB_STEP_SUMMARY"
